<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soufiane Messaoudi</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #f0f4f8;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        .text-container {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.6;
            background: linear-gradient(135deg, #ffb300, #ff8f00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(255, 179, 0, 0.2);
        }

        @media (max-width: 600px) {
            .text-container {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="text-container">
        سفيان مسعودي المالك الفعلي لأراضي مرجانة
    </div>

</body>
</html>
